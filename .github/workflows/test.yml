# Runs the automated checks on every push and pull request.
# The tests need no database or secrets: they use fake responses.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Backend lint
        working-directory: backend
        run: deno lint

      - name: Backend tests (matching, Turso client, scrapers)
        working-directory: backend
        run: deno test

      - name: Frontend tests (distance)
        working-directory: frontend
        run: deno test --no-check tests/
